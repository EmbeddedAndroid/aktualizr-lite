name: Aklite CI Tests
on:
  push:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: read

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v3

      - run: pwd; ls -la

      # - name: Build aklite-e2e-test image
      #   run: |
      #       DOCKER_BUILDKIT=1 docker build \
      #         --cache-from=type=gha \
      #         --cache-to=type=gha,mode=max \
      #         -t aklite-e2e-test:latest \
      #         -f docker-e2e-test/Dockerfile docker-e2e-test/

      - name: Build with Bake
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true # Loads built images into local Docker Engine for 'docker compose up'
          source: docker-e2e-test
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  clang:
    name: Clang Format And Tidy
    runs-on: ubuntu-latest
    needs: build-docker
    container:
      image: foundries/aklite-dev
      env:
        CXX: clang++
        CC: clang
        CCACHE_DIR: /tmp/ccache

    steps:
      - uses: actions/checkout@v3
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: config
        run: make -f dev-flow.mk config
      - name: format
        run: make -f dev-flow.mk format
      - name: tidy
        run: make -f dev-flow.mk tidy

  garage-tools:
    name: Build Garage Tools
    runs-on: ubuntu-latest
    needs: build-docker
    container:
      image: foundries/aklite-dev
      env:
        CXX: clang++
        CC: clang
        CCACHE_DIR: /tmp/ccache

    steps:
      - uses: actions/checkout@v3
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: build garage tools
        run: make -f dev-flow.mk garage-tools
      - name: check garage tools
        run: |
          if [[ ! -f build-garage/aktualizr/src/sota_tools/garage-sign/bin/garage-sign ]]; then
            echo "Failed to build garage-sign!"
            exit 1
          fi
          if [[ ! -f build-garage/aktualizr/src/sota_tools/garage-push ]]; then
            echo "Failed to build garage-push!"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build-docker

    container:
      image: foundries/aklite-dev
      env:
        CXX: clang++
        CC: clang
        CCACHE_DIR: /tmp/ccache
    steps:
      - uses: actions/checkout@v3
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - name: test
        run: make -f dev-flow.mk config build test


  e2e-test:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - run: ./dev-shell-e2e-test.sh make -f dev-flow.mk config build
      - run: ./dev-shell-e2e-test.sh pytest docker-e2e-test/e2e-test.py -k 'test_incremental_updates[False or test_update_to_latest[False'
        env:
          FACTORY: ${{ secrets.E2E_TEST_FACTORY }}
          BASE_TARGET_VERSION: ${{ secrets.E2E_TEST_BASE_TARGET_VERSION }}
          USER_TOKEN: ${{ secrets.E2E_TEST_USER_TOKEN }}
          TAG: ${{secrets.E2E_TEST_TAG}}

  e2e-test-1:
    name: End-to-end tests additional set
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory /__w/aktualizr-lite/aktualizr-lite
      - run: git submodule update --init --recursive
      - run: ./dev-shell-e2e-test.sh make -f dev-flow.mk config build
      - run: ./dev-shell-e2e-test.sh pytest docker-e2e-test/e2e-test.py -k 'test_no_space[False or test_forced_sync or test_bad_network or test_kill_process'
        env:
          FACTORY: ${{ secrets.E2E_TEST_FACTORY }}
          BASE_TARGET_VERSION: ${{ secrets.E2E_TEST_BASE_TARGET_VERSION }}
          USER_TOKEN: ${{ secrets.E2E_TEST_USER_TOKEN }}
          TAG: ${{secrets.E2E_TEST_TAG}}
